<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="全球从x86迁移所涉及的多架构软件工程任务" viewBox="0 0 800 450">
<text x="24" y="37" font-size="20" class="v-ink" text-anchor="start" font-weight="650">如果明天停止发布 x86 新芯片，谁需要做什么？</text><text x="24" y="63" font-size="12" class="v-sub" text-anchor="start">全球迁移的工作分散在整个软件供应链；下面是任务分类，不是成本估算。</text><text x="24" y="102" font-size="13" class="v-ink" text-anchor="start" font-weight="650">原有资产</text><text x="212" y="102" font-size="13" class="v-ink" text-anchor="start" font-weight="650">可以直接迁移的部分</text><text x="407" y="102" font-size="13" class="v-ink" text-anchor="start" font-weight="650">最难补的缺口</text><text x="604" y="102" font-size="13" class="v-ink" text-anchor="start" font-weight="650">承担主体</text><rect x="22" y="123" width="756" height="50" rx="7" fill="var(--surface-card)" stroke="var(--divider)" stroke-width="1"/><text x="32" y="153" font-size="13" class="v-ink" text-anchor="start" font-weight="600">开源软件 / CLI</text><text x="220" y="153" font-size="13" class="v-sub" text-anchor="start">再编译、跑测试</text><text x="415" y="153" font-size="13" class="v-sub" text-anchor="start">汇编优化 / SIMD</text><text x="612" y="153" font-size="13" class="v-sub" text-anchor="start">维护者 / CI</text><rect x="22" y="178" width="756" height="50" rx="7" fill="var(--surface-card)" stroke="var(--divider)" stroke-width="1"/><text x="32" y="208" font-size="13" class="v-ink" text-anchor="start" font-weight="600">桌面应用</text><text x="220" y="208" font-size="13" class="v-sub" text-anchor="start">原生构建 + 翻译层</text><text x="415" y="208" font-size="13" class="v-sub" text-anchor="start">插件 / 二进制依赖</text><text x="612" y="208" font-size="13" class="v-sub" text-anchor="start">厂商 / 用户</text><rect x="22" y="233" width="756" height="50" rx="7" fill="var(--surface-card)" stroke="var(--divider)" stroke-width="1"/><text x="32" y="263" font-size="13" class="v-ink" text-anchor="start" font-weight="600">操作系统 / 设备</text><text x="220" y="263" font-size="13" class="v-sub" text-anchor="start">多架构内核 / 驱动</text><text x="415" y="263" font-size="13" class="v-sub" text-anchor="start">固件 / 外设 / 安全驱动</text><text x="612" y="263" font-size="13" class="v-sub" text-anchor="start">OEM / 芯片厂</text><rect x="22" y="288" width="756" height="50" rx="7" fill="var(--surface-card)" stroke="var(--divider)" stroke-width="1"/><text x="32" y="318" font-size="13" class="v-ink" text-anchor="start" font-weight="600">云与企业业务</text><text x="220" y="318" font-size="13" class="v-sub" text-anchor="start">容器多架构镜像</text><text x="415" y="318" font-size="13" class="v-sub" text-anchor="start">虚拟机镜像 / 闭源软件</text><text x="612" y="318" font-size="13" class="v-sub" text-anchor="start">云厂 / IT 团队</text><rect x="22" y="343" width="756" height="50" rx="7" fill="var(--surface-card)" stroke="var(--divider)" stroke-width="1"/><text x="32" y="373" font-size="13" class="v-ink" text-anchor="start" font-weight="600">科研与性能库</text><text x="220" y="373" font-size="13" class="v-sub" text-anchor="start">编译器和框架已有基础</text><text x="415" y="373" font-size="13" class="v-sub" text-anchor="start">逐平台算子调优</text><text x="612" y="373" font-size="13" class="v-sub" text-anchor="start">工具链 / 开发者</text><text x="24" y="432" font-size="12" class="v-sub" text-anchor="start">示意图：没有把工作项做成“难度分数”，避免编造可比较的迁移成本。</text>
</svg>
