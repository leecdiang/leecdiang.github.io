<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="六项假设任务的迁移依赖" viewBox="0 0 800 400"><text x="24" y="35" font-size="25" class="v-ink">换到 Windows on Arm：逐项查依赖</text><text x="24" y="66" font-size="15" class="v-sub">下面是六项假设任务，每项只计一次。颜色和文字共同表示处理方式。</text><text x="24" y="109" font-size="17" class="v-sub">场景</text><text x="150" y="109" font-size="17" class="v-sub">手头的任务</text><text x="500" y="109" font-size="17" class="v-sub">迁移条件</text><path d="M24 122 L777 122" stroke="var(--divider)" stroke-width="2"/><text x="24" y="147" font-size="17" class="v-ink">日常</text><text x="150" y="147" font-size="17" class="v-ink">用原生 Arm64 浏览器看网页</text><path d="M486 132 L486 149" stroke="var(--chart-teal)" stroke-width="2"/><text x="500" y="147" font-size="17" class="v-ink">原生应用</text><path d="M24 166 L777 166" stroke="var(--divider)" stroke-width="2"/><text x="24" y="191" font-size="17" class="v-ink">日常</text><text x="150" y="191" font-size="17" class="v-ink">用原生文档软件编辑文档</text><path d="M486 176 L486 193" stroke="var(--chart-teal)" stroke-width="2"/><text x="500" y="191" font-size="17" class="v-ink">原生应用</text><path d="M24 210 L777 210" stroke="var(--divider)" stroke-width="2"/><text x="24" y="235" font-size="17" class="v-ink">日常</text><text x="150" y="235" font-size="17" class="v-ink">用原生播放器看视频</text><path d="M486 220 L486 237" stroke="var(--chart-teal)" stroke-width="2"/><text x="500" y="235" font-size="17" class="v-ink">原生应用</text><path d="M24 254 L777 254" stroke="var(--divider)" stroke-width="2"/><text x="24" y="279" font-size="17" class="v-ink">工程</text><text x="150" y="279" font-size="17" class="v-ink">用原生工具链编译可移植源码</text><path d="M486 264 L486 281" stroke="var(--chart-teal)" stroke-width="2"/><text x="500" y="279" font-size="17" class="v-ink">原生工具链</text><path d="M24 298 L777 298" stroke="var(--divider)" stroke-width="2"/><text x="24" y="323" font-size="17" class="v-ink">工程</text><text x="150" y="323" font-size="17" class="v-ink">运行仅发 x64 版的用户态工具</text><path d="M486 308 L486 325" stroke="var(--chart-amber)" stroke-width="2"/><text x="500" y="323" font-size="17" class="v-ink">可尝试翻译，须验证</text><path d="M24 342 L777 342" stroke="var(--divider)" stroke-width="2"/><text x="24" y="367" font-size="17" class="v-ink">工程</text><text x="150" y="367" font-size="17" class="v-ink">连接仅有 x64 内核驱动的仪器</text><path d="M486 352 L486 369" stroke="var(--chart-red)" stroke-width="2"/><text x="500" y="367" font-size="17" class="v-ink">缺原生驱动，受阻</text></svg>