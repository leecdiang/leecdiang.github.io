<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="现有 Intel 64 和 x86S 提案的启动路径" viewBox="0 0 800 350"><text x="24" y="36" font-size="25" class="v-ink">开机之后，谁还需要旧模式？</text><text x="24" y="68" font-size="15" class="v-sub">同一个目标：让现代 64 位系统开始运行。只画复位与模式切换。</text><text x="24" y="102" font-size="17" class="v-ink">现有 Intel 64</text><rect x="24" y="119" width="190" height="58" rx="8" fill="var(--surface-card)" stroke="var(--chart-amber)"/><text x="36" y="154.0" font-size="17" class="v-ink">8086 式复位状态</text><text x="225" y="154" font-size="24" class="v-sub">→</text><rect x="256" y="119" width="260" height="58" rx="8" fill="var(--surface-card)" stroke="var(--chart-amber)"/><text x="268" y="154.0" font-size="17" class="v-ink">启动代码切换模式</text><text x="527" y="154" font-size="24" class="v-sub">→</text><rect x="558" y="119" width="164" height="58" rx="8" fill="var(--surface-card)" stroke="var(--chart-amber)"/><text x="570" y="154.0" font-size="17" class="v-ink">64 位运行</text><text x="24" y="215" font-size="17" class="v-ink">x86S 提案</text><rect x="24" y="232" width="465" height="58" rx="8" fill="var(--surface-card)" stroke="var(--chart-teal)"/><text x="36" y="267.0" font-size="17" class="v-ink">直接进入 64 位复位状态</text><text x="500" y="267" font-size="24" class="v-sub">→</text><rect x="531" y="232" width="164" height="58" rx="8" fill="var(--surface-card)" stroke="var(--chart-teal)"/><text x="543" y="267.0" font-size="17" class="v-ink">64 位运行</text><text x="24" y="326" font-size="16" class="v-sub">提案仍保留 64 位系统运行 32 位应用的能力。Intel 后来停止推进 x86S。</text></svg>