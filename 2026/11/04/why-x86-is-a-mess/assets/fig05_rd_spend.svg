<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="2025年Intel和AMD公司总研发费用，非x86维护费用" viewBox="0 0 800 420">
<text x="24" y="40" font-size="22" class="v-ink" text-anchor="start" font-weight="650">2025 年 Intel / AMD 花了多少钱做研发？</text><text x="24" y="67" font-size="13" class="v-sub" text-anchor="start">公司总研发费用（US$ billion），不能当成“x86 兼容性维护费”。</text><path d="M170.0 110 V317" stroke="var(--divider)" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><text x="170.0" y="341" font-size="13" class="v-muted" text-anchor="middle">0</text><path d="M308.5 110 V317" stroke="var(--divider)" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><text x="308.5" y="341" font-size="13" class="v-muted" text-anchor="middle">4</text><path d="M447.0 110 V317" stroke="var(--divider)" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><text x="447.0" y="341" font-size="13" class="v-muted" text-anchor="middle">8</text><path d="M585.5 110 V317" stroke="var(--divider)" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><text x="585.5" y="341" font-size="13" class="v-muted" text-anchor="middle">12</text><path d="M724.0 110 V317" stroke="var(--divider)" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><text x="724.0" y="341" font-size="13" class="v-muted" text-anchor="middle">16</text><text x="24" y="169" font-size="19" class="v-ink" text-anchor="start" font-weight="650">Intel</text><rect x="170" y="141" width="477.83" height="45" rx="5" fill="var(--chart-blue)"/><text x="659.825" y="169" font-size="17" class="v-ink" text-anchor="start">13.80</text><text x="24" y="284" font-size="19" class="v-ink" text-anchor="start" font-weight="650">AMD</text><rect x="170" y="256" width="280.15" height="45" rx="5" fill="var(--chart-teal)"/><text x="462.150875" y="284" font-size="17" class="v-ink" text-anchor="start">8.09</text><text x="24" y="391" font-size="12" class="v-sub" text-anchor="start">合计 21.89 B 美元；官方财报没有把其中的 x86 兼容性维护成本单独披露。</text>
