<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1100">
  <defs>
    <filter id="atmosphere" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="70" /></filter>
    <filter id="diffusion" x="-55%" y="-55%" width="210%" height="210%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="36" /></filter>
    <filter id="bloom" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="18" /></filter>
    <filter id="core" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="7" /></filter>
    <linearGradient id="exposure" gradientUnits="userSpaceOnUse" x1="0" y1="220" x2="560" y2="910">
      <stop stop-color="white" stop-opacity=".85" />
      <stop offset=".24" stop-color="white" />
      <stop offset=".52" stop-color="white" stop-opacity=".86" />
      <stop offset=".76" stop-color="white" stop-opacity=".62" />
      <stop offset="1" stop-color="white" stop-opacity=".78" />
    </linearGradient>
    <mask id="exposure-mask" maskUnits="userSpaceOnUse" x="-500" y="-400" width="2200" height="2000"><rect x="-500" y="-400" width="2200" height="2000" fill="url(#exposure)" /></mask>
    <ellipse id="contour" cx="220" cy="550" rx="310" ry="385" transform="rotate(-19 220 550)" />
  </defs>
  <g fill="none" mask="url(#exposure-mask)">
    <use xlink:href="#contour" stroke="#efb24c" stroke-width="110" opacity=".16" filter="url(#atmosphere)" />
    <use xlink:href="#contour" stroke="#ffc85c" stroke-width="64" opacity=".30" filter="url(#diffusion)" />
    <use xlink:href="#contour" stroke="#ffda7b" stroke-width="30" opacity=".50" filter="url(#bloom)" />
    <use xlink:href="#contour" stroke="#ffe8aa" stroke-width="12" opacity=".62" filter="url(#core)" />
  </g>
</svg>